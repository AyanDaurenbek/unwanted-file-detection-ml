seed: 42
model_registry: models
train_samples: 500
val_samples: 200
test_samples: 200
features:
  categorical: ["mime_type"]
  numeric: ["file_size", "entropy", "num_printable_strings", "avg_string_len", "num_sections"]
data:
  path: null  # Set to your dataset CSV, e.g., data/train.csv
  target_column: label
model:
  baseline:
    type: "random_forest"
    params:
      n_estimators: 100
      random_state: 42
  advanced:
    type: "lightgbm"
    params:
      num_leaves: 31
      learning_rate: 0.05
      n_estimators: 200
output:
  model_version: "v1-baseline"
  metrics_path: "models/metrics.json"
  model_card_path: "models/model_card.md"
