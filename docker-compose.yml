version: "3.9"
services:
  api:
    build: ./docker
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app
  worker:
    build: ./docker
    command: celery -A src.tasks.celery_app worker --loglevel=info -Q scan_queue
    env_file: .env.example
    depends_on:
      - redis
      - db
    volumes:
      - ./:/app
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unwanted_files
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
