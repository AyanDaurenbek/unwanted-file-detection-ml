[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unwanted-file-detection-ml"
version = "0.1.0"
description = "Intelligent system for detecting unwanted files using ML"
authors = [{name = "AutoGenerated", email = "dev@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "celery",
  "redis",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg2-binary",
  "structlog",
  "pydantic>=1.10,<3",
  "python-multipart",
  "prometheus-client",
  "python-magic",
  "pefile",
  "lief",
  "oletools",
  "numpy",
  "pandas",
  "scikit-learn",
  "lightgbm",
  "joblib",
  "pyyaml",
  "requests",
  "mypy",
  "ruff",
  "black",
  "pytest",
  "httpx",
  "faker",
  "jinja2"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
